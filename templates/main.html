<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div>
        <a href="/post/new">New post</a>
    </div>
    {% for post in posts %}
    <div class="postAbst">
        <span class="time">{{ post.time.strftime("%d. %B %H:%M") }}</span>
        <a class="title" href="/post/{{ post.url }}">{{ post.title }}</a> 
    </div>
    {% endfor %}
</body>
</html>
